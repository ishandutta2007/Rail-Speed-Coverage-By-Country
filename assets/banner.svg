<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 300"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0b0f19"/><stop offset="50%" stop-color="#111827"/><stop offset="100%" stop-color="#1e1035"/></linearGradient><radialGradient id="vignette" cx="50%" cy="50%" r="70%"><stop offset="60%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#030712" stop-opacity=".7"/></radialGradient><linearGradient id="line-india" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#F93"/><stop offset="100%" stop-color="#138808"/></linearGradient><linearGradient id="line-eu" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#039"/><stop offset="100%" stop-color="#FC0"/></linearGradient><linearGradient id="line-china" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#DE2910"/><stop offset="100%" stop-color="#FFDE00"/></linearGradient><linearGradient id="glow-cyan" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#06b6d4" stop-opacity=".8"/><stop offset="100%" stop-color="#3b82f6" stop-opacity=".2"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="4"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="glow-strong" width="160%" height="160%" x="-30%" y="-30%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><style>@keyframes pulse{0%{opacity:.3;transform:scale(1)}50%{opacity:.7;transform:scale(1.05)}}@keyframes move-light{0%{transform:translateX(-200px)}}.badge,.subtitle,.title{font-family:system-ui,-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,sans-serif}.title{font-size:42px;font-weight:800;fill:#fff;letter-spacing:-.5px}.subtitle{font-size:18px;font-weight:400;fill:#9ca3af;letter-spacing:.5px}.badge{font-size:12px;font-weight:600;fill:#38bdf8;letter-spacing:1.5px;text-transform:uppercase}.animated-track{stroke-dasharray:10,15;animation:dash 3s linear infinite}.animated-track-fast{stroke-dasharray:20,10;animation:dash 1.5s linear infinite}.pulse-bg{animation:pulse 6s ease-in-out infinite;transform-origin:center}</style></defs><rect width="1200" height="300" fill="url(#bg-grad)" rx="16"/><g class="pulse-bg" opacity=".25"><circle cx="1000" cy="80" r="250" fill="#7c3aed" filter="blur(60px)"/><circle cx="200" cy="220" r="180" fill="#0284c7" filter="blur(50px)"/></g><g stroke="#fff" stroke-opacity=".04" stroke-width="1"><path d="M 0 50 L 1200 50 M 0 100 L 1200 100 M 0 150 L 1200 150 M 0 200 L 1200 200 M 0 250 L 1200 250"/><path d="M 150 0 L 150 300 M 300 0 L 300 300 M 450 0 L 450 300 M 600 0 L 600 300 M 750 0 L 750 300 M 900 0 L 900 300 M 1050 0 L 1050 300"/></g><g opacity=".6"><path fill="none" stroke="#1e293b" stroke-width="6" d="M -50 240 C 300 240, 450 270, 750 270 C 950 270, 1100 220, 1250 220"/><path fill="none" stroke="url(#glow-cyan)" stroke-width="3" d="M -50 240 C 300 240, 450 270, 750 270 C 950 270, 1100 220, 1250 220" class="animated-track-fast" filter="url(#glow)"/><path fill="none" stroke="#334155" stroke-width="4" d="M -50 210 C 200 210, 350 180, 600 180 C 850 180, 1000 250, 1250 250"/><path fill="none" stroke="#a855f7" stroke-dasharray="8 8" stroke-width="2" d="M -50 210 C 200 210, 350 180, 600 180 C 850 180, 1000 250, 1250 250" class="animated-track" opacity=".8"/><path fill="none" stroke="#0ea5e9" stroke-opacity=".3" stroke-width="2" d="M -50 160 C 250 160, 400 220, 700 210 C 900 200, 1050 150, 1250 150" class="animated-track"/></g><g opacity=".85"><g transform="translate(850, 70) translate(140, 0)"><rect width="130" height="32" x="0" y="0" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" rx="16"/><circle cx="16" cy="16" r="5" fill="#ef4444"/><text x="30" y="21" fill="#e0e7ff" font-family="system-ui, sans-serif" font-size="12" font-weight="700">350 km/h</text></g><g transform="translate(850, 70) translate(80, 45)"><rect width="130" height="32" x="0" y="0" fill="#0f172a" stroke="#0284c7" stroke-width="1" rx="16"/><circle cx="16" cy="16" r="5" fill="#3b82f6"/><text x="30" y="21" fill="#e0f2fe" font-family="system-ui, sans-serif" font-size="12" font-weight="700">200 km/h</text></g><g transform="translate(850, 70) translate(20, 90)"><rect width="130" height="32" x="0" y="0" fill="#062c19" stroke="#10b981" stroke-width="1" rx="16"/><circle cx="16" cy="16" r="5" fill="#10b981"/><text x="30" y="21" fill="#ecfdf5" font-family="system-ui, sans-serif" font-size="12" font-weight="700">160 km/h</text></g></g><rect width="700" height="210" x="50" y="40" fill="#0b0f19" fill-opacity=".6" stroke="#fff" stroke-opacity=".08" backdrop-filter="blur(12px)" rx="16"/><g><g transform="translate(80, 80) translate(0, 0)"><rect width="220" height="26" x="0" y="0" fill="#0369a1" fill-opacity=".3" stroke="#0284c7" stroke-opacity=".4" rx="6"/><text x="12" y="17" class="badge">INFRASTRUCTURE ANALYTICS</text></g><text x="0" y="62" class="title" transform="translate(80, 80)">Rail Speed Coverage</text><text x="0" y="102" fill="#38bdf8" class="title" font-size="34" transform="translate(80, 80)">By Country &amp; Region</text><text x="0" y="138" class="subtitle" transform="translate(80, 80)">Global breakdown of network distribution across India, Europe &amp; China</text></g><g transform="translate(80, 228)"><rect width="50" height="4" x="0" y="0" fill="url(#line-india)" rx="2"/><text x="60" y="6" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="11" font-weight="600">India</text><rect width="50" height="4" x="120" y="0" fill="url(#line-eu)" rx="2"/><text x="180" y="6" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Europe (EU)</text><rect width="50" height="4" x="270" y="0" fill="url(#line-china)" rx="2"/><text x="330" y="6" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="11" font-weight="600">China</text></g></svg>