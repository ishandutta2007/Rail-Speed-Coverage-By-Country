<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e1035" />
    </linearGradient>

    <!-- Overlay Radial Gradient for Vignette & Depth -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="60%" stop-color="#000000" stop-opacity="0" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0.7" />
    </radialGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="line-india" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF9933" />
      <stop offset="100%" stop-color="#138808" />
    </linearGradient>

    <linearGradient id="line-eu" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#003399" />
      <stop offset="100%" stop-color="#FFCC00" />
    </linearGradient>

    <linearGradient id="line-china" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DE2910" />
      <stop offset="100%" stop-color="#FFDE00" />
    </linearGradient>

    <linearGradient id="glow-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glow-strong" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .title {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 42px;
        font-weight: 800;
        fill: #ffffff;
        letter-spacing: -0.5px;
      }
      .subtitle {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 18px;
        font-weight: 400;
        fill: #9ca3af;
        letter-spacing: 0.5px;
      }
      .badge {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 12px;
        font-weight: 600;
        fill: #38bdf8;
        letter-spacing: 1.5px;
        text-transform: uppercase;
      }
      
      /* CSS Animations for subtle dynamic dynamic effects */
      @keyframes dash {
        to {
          stroke-dashoffset: -100;
        }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.7; transform: scale(1.05); }
      }
      @keyframes move-light {
        0% { transform: translateX(-200px); }
        100% { transform: translateX(1400px); }
      }

      .animated-track {
        stroke-dasharray: 10, 15;
        animation: dash 3s linear infinite;
      }

      .animated-track-fast {
        stroke-dasharray: 20, 10;
        animation: dash 1.5s linear infinite;
      }

      .pulse-bg {
        animation: pulse 6s ease-in-out infinite;
        transform-origin: center;
      }

      .light-streak {
        animation: move-light 4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
    </style>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="300" fill="url(#bg-grad)" rx="16" />

  <!-- Animated Background Shapes/Grid (Layer 1 - Dynamic Background) -->
  <g class="pulse-bg" opacity="0.25">
    <circle cx="1000" cy="80" r="250" fill="#7c3aed" filter="blur(60px)" />
    <circle cx="200" cy="220" r="180" fill="#0284c7" filter="blur(50px)" />
  </g>

  <!-- Grid Pattern overlay -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <path d="M 0 50 L 1200 50 M 0 100 L 1200 100 M 0 150 L 1200 150 M 0 200 L 1200 200 M 0 250 L 1200 250" />
    <path d="M 150 0 L 150 300 M 300 0 L 300 300 M 450 0 L 450 300 M 600 0 L 600 300 M 750 0 L 750 300 M 900 0 L 900 300 M 1050 0 L 1050 300" />
  </g>

  <!-- Dynamic Rail Lines/Flows (Layer 2 - Dynamic Decorative Graphics) -->
  <g opacity="0.6">
    <!-- Bottom High Speed Line -->
    <path d="M -50 240 C 300 240, 450 270, 750 270 C 950 270, 1100 220, 1250 220" fill="none" stroke="#1e293b" stroke-width="6" />
    <path d="M -50 240 C 300 240, 450 270, 750 270 C 950 270, 1100 220, 1250 220" fill="none" stroke="url(#glow-cyan)" stroke-width="3" class="animated-track-fast" filter="url(#glow)" />

    <!-- Middle Connecting Flow -->
    <path d="M -50 210 C 200 210, 350 180, 600 180 C 850 180, 1000 250, 1250 250" fill="none" stroke="#334155" stroke-width="4" />
    <path d="M -50 210 C 200 210, 350 180, 600 180 C 850 180, 1000 250, 1250 250" fill="none" stroke="#a855f7" stroke-dasharray="8,8" stroke-width="2" class="animated-track" opacity="0.8" />

    <!-- Upper Wave Flow -->
    <path d="M -50 160 C 250 160, 400 220, 700 210 C 900 200, 1050 150, 1250 150" fill="none" stroke="#0ea5e9" stroke-opacity="0.3" stroke-width="2" class="animated-track" />
  </g>

  <!-- Speedometer / Data Pill Accents in right side background -->
  <g transform="translate(850, 70)" opacity="0.85">
    <!-- China Speed Tag -->
    <g transform="translate(140, 0)">
      <rect x="0" y="0" width="130" height="32" rx="16" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" />
      <circle cx="16" cy="16" r="5" fill="#ef4444" />
      <text x="30" y="21" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#e0e7ff">350 km/h</text>
    </g>
    <!-- Europe Speed Tag -->
    <g transform="translate(80, 45)">
      <rect x="0" y="0" width="130" height="32" rx="16" fill="#0f172a" stroke="#0284c7" stroke-width="1" />
      <circle cx="16" cy="16" r="5" fill="#3b82f6" />
      <text x="30" y="21" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#e0f2fe">200 km/h</text>
    </g>
    <!-- India Speed Tag -->
    <g transform="translate(20, 90)">
      <rect x="0" y="0" width="130" height="32" rx="16" fill="#062c19" stroke="#10b981" stroke-width="1" />
      <circle cx="16" cy="16" r="5" fill="#10b981" />
      <text x="30" y="21" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ecfdf5">160 km/h</text>
    </g>
  </g>

  <!-- Semi-Transparent Dark Card Backplate for Text (Ensures crisp contrast & guaranteed foreground isolation) -->
  <rect x="50" y="40" width="700" height="210" rx="16" fill="#0b0f19" fill-opacity="0.6" stroke="#ffffff" stroke-opacity="0.08" backdrop-filter="blur(12px)" />

  <!-- Foreground Text Content (Layer 3 - Main Foreground Title & Subtitle) -->
  <g transform="translate(80, 80)">
    <!-- Category Badge -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="220" height="26" rx="6" fill="#0369a1" fill-opacity="0.3" stroke="#0284c7" stroke-opacity="0.4" />
      <text x="12" y="17" class="badge">INFRASTRUCTURE ANALYTICS</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="62" class="title">Rail Speed Coverage</text>
    <text x="0" y="102" class="title" fill="#38bdf8" font-size="34">By Country &amp; Region</text>

    <!-- Subtitle -->
    <text x="0" y="138" class="subtitle">Global breakdown of network distribution across India, Europe &amp; China</text>
  </g>

  <!-- Decorative Color Indicators at Bottom of Card -->
  <g transform="translate(80, 228)">
    <!-- India Flag Colors Bar -->
    <rect x="0" y="0" width="50" height="4" rx="2" fill="url(#line-india)" />
    <text x="60" y="6" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#9ca3af">India</text>

    <!-- EU Colors Bar -->
    <rect x="120" y="0" width="50" height="4" rx="2" fill="url(#line-eu)" />
    <text x="180" y="6" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#9ca3af">Europe (EU)</text>

    <!-- China Colors Bar -->
    <rect x="270" y="0" width="50" height="4" rx="2" fill="url(#line-china)" />
    <text x="330" y="6" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#9ca3af">China</text>
  </g>
</svg>
